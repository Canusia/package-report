{% load templatehelpers %}
{% load crispy_forms_tags %}

<div class="row">
    <div class="col-12">
        <div class="p-3">
            <h3 id="report-title">{{title}}</h3>
        </div>
    </div>
    <div class="col-6">
        <div class="p-3" id="report-form-container">
            {{form_html}}
            {% if use_as_datasource %}
            <button type="button" class="btn btn-outline-primary btn-sm mt-2"
                    onclick="useReportAsDatasource('{{report_id}}', this)">Use as datasource</button>
            {% endif %}
        </div>
    </div>
    <div class="col-6">
        <div class="p-3">
                    <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" data-toggle="tab" href="#description">Description</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-toggle="tab" href="#recent">Recent Runs</a>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane active " id="description">

                            <div class="card border-top-0">
                                <div class="card-body">
                                    {% if is_superuser %}
                                    <div id="description-display">
                                        {{description|safe}}
                                        <hr>
                                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-edit-report">
                                            <i class="fa fa-pencil"></i> Edit
                                        </button>
                                    </div>
                                    <div id="description-edit" style="display: none;">
                                        <div class="form-group mb-3">
                                            <label for="edit-report-title"><strong>Title</strong></label>
                                            <input type="text" class="form-control" id="edit-report-title" value="{{title}}">
                                        </div>
                                        <div class="form-group mb-3">
                                            <label for="edit-report-description"><strong>Description</strong></label>
                                            <textarea class="form-control" id="edit-report-description" rows="3">{{raw_description}}</textarea>
                                        </div>
                                        <button type="button" class="btn btn-sm btn-primary" id="btn-save-report">Save</button>
                                        <button type="button" class="btn btn-sm btn-secondary" id="btn-cancel-edit">Cancel</button>
                                    </div>
                                    {% else %}
                                    {{description|safe}}
                                    {% endif %}
                                </div>
                            </div>
                        </div>

                        <div class="tab-pane" id="recent">
                            
                            <div class="card border-top-0">
                                <div class="card-body">
                                    <table id="report_runs" style="width: 100%;" class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>Run On</th>
                                                <th>Status</th>
                                                <th>Report</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function useReportAsDatasource(reportId, btn) {
    // The report's crispy form is a sibling of this button within the container.
    var $container = $(btn).closest('#report-form-container');
    var $form = $container.find('form').first();
    if (!$form.length) { $form = $(btn).closest('form'); }
    var data = $form.serializeArray();
    data.push({name: 'report_id', value: reportId});
    $.post('/ce/announcements/bulk_message/use_report_as_datasource', data, function (r) {
        if (r.status === 'success' && r.redirect_to) { window.location = r.redirect_to; }
    });
}
</script>

{% if is_superuser %}
<script>
(function($) {
    var reportId = '{{report_id}}';

    $(document).on('click', '#btn-edit-report', function() {
        $('#description-display').hide();
        $('#description-edit').show();
    });

    $(document).on('click', '#btn-cancel-edit', function() {
        $('#description-edit').hide();
        $('#description-display').show();
    });

    $(document).on('click', '#btn-save-report', function() {
        var title = $('#edit-report-title').val().trim();
        var description = $('#edit-report-description').val().trim();
        var csrftoken = $('[name=csrfmiddlewaretoken]').val();

        if (!title) {
            swal('Error', 'Title is required', 'error');
            return;
        }

        $.post({
            url: 'update_report/',
            data: {
                report_id: reportId,
                title: title,
                description: description,
                csrfmiddlewaretoken: csrftoken
            },
            success: function(response) {
                $('#report-title').text(title);
                $('#report-list li.active').text(title);

                var displayHtml = (description || '-');
                displayHtml += '<hr><button type="button" class="btn btn-sm btn-outline-secondary" id="btn-edit-report">';
                displayHtml += '<i class="fa fa-pencil"></i> Edit</button>';
                $('#description-display').html(displayHtml);

                $('#description-edit').hide();
                $('#description-display').show();

                swal('Success', response.message, 'success');
            },
            error: function() {
                swal('Error', 'Failed to update report', 'error');
            }
        });
    });
})(jQuery);
</script>
{% endif %}
